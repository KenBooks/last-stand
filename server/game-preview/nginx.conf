# A PR preview's files, as Pages serves production: the hashed assets kept a year, everything else (the page, the
# offline worker, the manifest) asked for again every time, so a reload shows the PR's newest build.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # (nginx's own types have no webmanifest: served as a download, the browser wouldn't install the app)
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
