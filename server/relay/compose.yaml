# The co-op relay, the traces service and the saves service as Dokci deploys them (.dokci/project.yaml routes the
# public host to the relay over Traefik, its /traces to the traces, server/traces, and its /saves to the saves,
# server/saves: each a process of its own, so an upload never holds rooms up). The PR previews are stacks of their
# own (server/game-preview).
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ORIGINS: https://last-stand.cc,https://www.last-stand.cc,https://victorzakharov.github.io,https://ls.wellscoped.dev,https://pr-*.ls.wellscoped.dev,https://c-*.ls.wellscoped.dev,http://localhost:5173
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 128MiB
  traces:
    build:
      context: ../traces
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATA: /data
      ORIGINS: https://last-stand.cc,https://www.last-stand.cc,https://victorzakharov.github.io,https://ls.wellscoped.dev,https://pr-*.ls.wellscoped.dev,https://c-*.ls.wellscoped.dev,http://localhost:5173
      # (the secret agents read the traces with: Dokci's configuration, never in the repo; unset, reading is off)
      TRACES_TOKEN: ${LS_TRACES_TOKEN:-}
      # (addresses never held to the reports a day: the owner's, testing; Dokci's configuration, never in the repo)
      TRUSTED_ADDRESSES: ${LS_TRACES_TRUSTED:-}
      KEEP_DAYS: "30"
      DISK_MAX: "104857600"
    volumes:
      - traces-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/traces/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 96MiB
  saves:
    build:
      context: ../saves
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATA: /data
      ORIGINS: https://last-stand.cc,https://www.last-stand.cc,https://victorzakharov.github.io,https://ls.wellscoped.dev,https://pr-*.ls.wellscoped.dev,https://c-*.ls.wellscoped.dev,http://localhost:5173
      # (every other setting has its default in saves.mjs: none is a secret, none needs Dokci's configuration)
    volumes:
      - saves-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/saves/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 96MiB
volumes:
  traces-data:
  saves-data:
