# The co-op relay and the PR previews service as Dokci deploys them (.dokci/project.yaml routes the public host to the
# relay over Traefik, and its /pr-preview to the previews: server/previews, a process of its own so an upload never
# holds rooms up).
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ORIGINS: https://last-stand.cc,https://www.last-stand.cc,https://victorzakharov.github.io,https://ls.wellscoped.dev,http://localhost:5173
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 128MiB
  previews:
    build:
      context: ../previews
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATA: /data
      # (the secret pr-preview.yml sends builds with: Dokci's configuration, never in the repo; unset, nothing can
      # be sent and what's kept is still served)
      PREVIEWS_TOKEN: ${LS_PREVIEWS_TOKEN:-}
      KEEP: "3"
      DISK_MAX: "2147483648"
      SITE: https://last-stand.cc/
    volumes:
      - previews-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/pr-preview/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256MiB
volumes:
  previews-data:
