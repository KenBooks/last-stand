# Dokci deploys the co-op relay (server/relay), the traces service (server/traces) and the saves service
# (server/saves) on every push to main, and each open PR's preview (server/game-preview) at a host of its own;
# production itself stays on GitHub Pages.
apiVersion: compose.control/v1alpha1
kind: Project
metadata:
  name: last-stand-relay
  displayName: Last Stand co-op relay
spec:
  repository:
    provider: github
    owner: VictorZakharov
    name: last-stand
  defaults:
    targetRef: local-vps
    resources:
      cpuLimit: "0.5"
      memoryLimit: 128MiB
  configuration:
    LS_TRACES_TOKEN:
      description: The secret agents read the performance traces with (npm run lab -- trace).
      whenMissing: Traces are still taken from the games and kept; nothing can read them.
    LS_TRACES_TRUSTED:
      description: Addresses (comma-separated) whose performance reports are never held to 10 a day, for testing.
      whenMissing: Every address may send 10 reports a day from each site.
  environments:
    production:
      source:
        branch: main
      stack:
        composeFiles:
          - server/relay/compose.yaml
      routes:
        - service: relay
          port: 8080
          host: ls.wellscoped.dev
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /health
          # A WebSocket relay, not a page: Dokci shows no link to it (Dokci ADR 0073).
          link:
            hidden: true
        - service: traces
          port: 8080
          host: ls.wellscoped.dev
          pathPrefix: /traces
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /traces/health
          # The traces page: Dokci opens it signed in with this environment's LS_TRACES_TOKEN, through a one-time
          # link the service checks (server/traces/AGENTS.md); the token never leaves Dokci.
          link:
            signInWith: LS_TRACES_TOKEN
        - service: saves
          port: 8080
          host: ls.wellscoped.dev
          pathPrefix: /saves
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /saves/health
          # Cloud saves' API for the game's pages, not a page: Dokci shows no link to it.
          link:
            hidden: true
      deploymentPolicy:
        requireManualApproval: false
  # Each open PR's preview, built by Dokci from its head (server/game-preview): the game at its own host,
  # https://pr-N.ls.wellscoped.dev/, under the DNS's wildcard *.ls.wellscoped.dev. Dokci reads this policy from main
  # alone, takes only same-repository PRs by collaborators (no forks, no drafts), and links each ready preview from
  # the PR's "Dokci preview" check. feedback.comment also posts a new PR comment for every build: the link and its
  # times when ready, the reason when it failed (Dokci ADR 0068; needs the App's Pull requests: write).
  previews:
    - name: pr
      baseBranches:
        - main
      stack:
        composeFiles:
          - server/game-preview/compose.yaml
      hostTemplate: "pr-{{ pullRequest.number }}.ls.wellscoped.dev"
      # A commit build (`dokci previews build`, Dokci ADR 0087): one commit, by branch or SHA, without a PR, for 24 h
      # by default (30 days at most), at the commit's first 12 hex digits.
      commitHostTemplate: "c-{{ commit.short }}.ls.wellscoped.dev"
      routes:
        - service: game
          port: 8080
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /health
      trust:
        allowForks: true
        requireRepositoryCollaborator: true
        # Their forks' PRs are previewed as pushed, without approving each run (Dokci ADR 0085).
        trustedAuthors: [KenBooks, akshvic]
      cleanup:
        deleteVolumes: true
        closedPreviewRetention: 0m
        orphanTtl: 7d
      resources:
        cpuLimit: "0.25"
        memoryLimit: 64MiB
        pidsLimit: 64
        storageLimit: 512MiB
        routeLimit: 1
      feedback:
        comment: true
