# Dokci deploys the co-op relay (server/relay), the PR previews service (server/previews) and the traces service
# (server/traces) on every push to main; the game itself stays on GitHub Pages.
apiVersion: compose.control/v1alpha1
kind: Project
metadata:
  name: last-stand-relay
  displayName: Last Stand co-op relay
spec:
  repository:
    provider: github
    owner: VictorZakharov
    name: last-stand
  defaults:
    targetRef: local-vps
    resources:
      cpuLimit: "0.5"
      memoryLimit: 128MiB
  configuration:
    LS_PREVIEWS_TOKEN:
      description: The secret pr-preview.yml sends PR builds with (the repo's pr-preview environment's PREVIEWS_TOKEN).
      whenMissing: Previews kept are still served; no build can be sent, so every publish fails.
    LS_TRACES_TOKEN:
      description: The secret agents read the performance traces with (npm run lab -- trace).
      whenMissing: Traces are still taken from the games and kept; nothing can read them.
  environments:
    production:
      source:
        branch: main
      stack:
        composeFiles:
          - server/relay/compose.yaml
      routes:
        - service: relay
          port: 8080
          host: ls.wellscoped.dev
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /health
        - service: previews
          port: 8080
          host: ls.wellscoped.dev
          pathPrefix: /pr-preview
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /pr-preview/health
        - service: traces
          port: 8080
          host: ls.wellscoped.dev
          pathPrefix: /traces
          entryPoint: websecure
          certificateResolver: letsencrypt
          healthProbePath: /traces/health
      deploymentPolicy:
        requireManualApproval: false
