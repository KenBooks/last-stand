name: PR preview

# Publishes what pr-preview-build.yml built on our own previews service (server/previews, deployed by Dokci beside
# the co-op relay, PREVIEW_ORIGIN), and keeps a sticky PR comment with the preview link. A closed or merged PR's
# preview is removed.
#
# Each build is served from a folder of its own, `pr-preview/pr-N/<sha7>/`, the moment the service has it: the
# service unpacks it beside and moves it into place, and answers once it's served (no Pages deploy queue, which
# held each publish 100 to 330 s and sometimes over 600, and no CDN holding a path's old copy). The PR's stable page,
# `pr-preview/pr-N/` (`.github/preview-index.html`, main's copy, sent with each publish), goes to the newest build
# by the PR's `latest.json`, which the service serves beside it, never cached:
#   { headSha, state: building | ready | failed, folder, since, run }
# While a push builds it says `building` and the stable page shows how long, the last build still linked (#292).
#
# Each publish catches up the others: every open PR whose newest finished build `latest.json` doesn't record yet
# (a run lost or failed) is published too, its artifact downloaded and checked as its own, and every preview kept of
# a PR no longer open is removed. It runs for every finished build (cancelled and skipped ones too) and after every
# production deploy; run it by hand (workflow_dispatch) to catch up without a build.
#
# This runs on `workflow_run`, so it uses the workflow from main with the preview service's secret even for fork
# PRs. It never runs PR code: the artifact is only packed and sent as files, and its PR number is checked against
# the API (the PR's head must be the commit that was built). What each step does is a module in `scripts/preview/`
# (its tests: `npm run preview:test`), checked out from this run's commit, main's head, beside the stable page:
# never the PR's.

on:
  workflow_run:
    # (production's deploy only for its completion: a merged PR's preview removed soon after)
    workflows: [PR preview build, Deploy GitHub Pages]
    types: [requested, completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  # the previews service (server/previews): the relay's host unless the repo's PREVIEW_ORIGIN variable says another
  PREVIEW_ORIGIN: ${{ vars.PREVIEW_ORIGIN || 'https://ls.wellscoped.dev' }}

jobs:
  building:
    name: Mark the PR preview as building
    if: github.event.workflow_run.event == 'pull_request' && github.event.action == 'requested'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # (its secret, PREVIEWS_TOKEN, is this environment's: only main's copy of this workflow can reach it)
    environment:
      name: pr-preview
    steps:
      # this run's commit, main's head: never the PR's
      - name: Check out the stable page and the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          sparse-checkout: |
            .github/preview-index.html
            scripts/preview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Say the preview is building
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEWS_TOKEN: ${{ secrets.PREVIEWS_TOKEN }}
        with:
          script: |
            const { markBuildingPr } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/scripts/preview/steps.mjs`);
            await markBuildingPr({ github, context, core });

  # Publishes the build that triggered it and catches up every other one left unpublished.
  publish:
    name: Publish PR previews
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'completed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    environment:
      name: pr-preview
    steps:
      # this run's commit, main's head: never the PR's
      - name: Check out the stable page and the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          sparse-checkout: |
            .github/preview-index.html
            scripts/preview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The triggering build, and each open PR's newest finished build the service doesn't record yet: each artifact
      # downloaded, its pr.json believed only when the API agrees (the PR's head is the commit built).
      - name: Find the builds to publish
        id: find
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEWS_TOKEN: ${{ secrets.PREVIEWS_TOKEN }}
        with:
          script: |
            const { findPublish } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/scripts/preview/steps.mjs`);
            await findPublish({ github, context, core, exec });

      # each build packed and sent, read back at its public address, then the stable page sent to it; each PR's
      # comment a checklist while it goes, then what came of it
      - name: Publish each build
        if: steps.find.outputs.count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEWS_TOKEN: ${{ secrets.PREVIEWS_TOKEN }}
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/trusted/scripts/preview/steps.mjs`);
            await publish({ github, context, core });
