name: PR preview build

# Builds every pull request, forks included, into an artifact that
# pr-preview.yml publishes. This run executes the PR's code, so it gets a
# read-only token and no secrets; everything that writes (the previews
# service, the PR comment) happens in pr-preview.yml, which runs trusted code
# from main. Each build is made for a folder of its own,
# `/pr-preview/pr-N/<sha7>/`, where the previews service (server/previews)
# serves it at its origin's root.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR preview
    env:
      # the PR's own commit, not the merge commit checked out
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'closed' || github.event.pull_request.merged != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Test the lab's own code
        if: github.event.action != 'closed'
        run: npm run lab:test

      # (pr-preview.yml runs main's copy of these scripts: a PR's are tested here before they get there)
      - name: Test the preview publish's scripts
        if: github.event.action != 'closed'
        run: npm run preview:test

      - name: Test the previews service
        if: github.event.action != 'closed'
        run: npm run previews:test

      - name: Type-check and build preview
        if: github.event.action != 'closed'
        env:
          # the pause menu's build label
          BUILD_PR: ${{ github.event.pull_request.number }}
        run: |
          npm run typecheck
          BUILD_SHA="${HEAD_SHA}" npx vite build --base="/pr-preview/pr-${PR_NUMBER}/${HEAD_SHA:0:7}/"

      - name: Verify preview asset paths
        if: github.event.action != 'closed'
        run: PAGES_BASE="/pr-preview/pr-${PR_NUMBER}/${HEAD_SHA:0:7}/" npm run check:pages

      # pr-preview.yml treats this as untrusted input and checks it against the API
      - name: Describe the preview
        env:
          PR_ACTION: ${{ github.event.action }}
        run: |
          mkdir -p preview/site
          if [[ "${PR_ACTION}" != "closed" ]]; then
            folder="${HEAD_SHA:0:7}"
            mkdir -p "preview/site/${folder}"
            cp -a dist/. "preview/site/${folder}/"
          fi
          printf '{"number":%d,"action":"%s"}\n' "${PR_NUMBER}" "${PR_ACTION}" > preview/pr.json

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview
          path: preview
          include-hidden-files: true
          retention-days: 1
