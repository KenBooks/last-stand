name: Deploy GitHub Pages

# Production deploy, from the `gh-pages` branch, which holds production alone.
# The PR previews are Dokci's (server/game-preview), each at a host of its own.

# Only a merge that changes what the build reads deploys. The build is stamped with its commit and time, so a
# deploy of the same game is a new version to every player's page and its worker: a merge of the lab's code
# alone (#830) rebuilt and republished production. A manual run (workflow_dispatch) deploys whatever changed.
# A new place the build reads from goes in this list, or its changes won't ship until the next merge that does.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      # (the worker and the Pages check the build runs: scripts/pwa.ts, scripts/check-pages-build.mjs)
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
      # (the agents' notes sit beside the code and the build reads none of them)
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publisher
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Type-check and build
        run: npm run build

      - name: Verify Pages-safe asset paths
        run: npm run check:pages

      - name: Stage production
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="${RUNNER_TEMP}/pages"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "${pages_dir}" origin/gh-pages
          else
            git worktree add --detach "${pages_dir}"
            git -C "${pages_dir}" switch --orphan gh-pages
            git -C "${pages_dir}" rm -rf --ignore-unmatch .
          fi

          # replace everything but the branch's own git files: production alone
          find "${pages_dir}" -mindepth 1 -maxdepth 1 \
            ! -name .git \
            -exec rm -rf {} +

          cp -a dist/. "${pages_dir}/"
          touch "${pages_dir}/.nojekyll"

          git -C "${pages_dir}" config user.name "github-actions[bot]"
          git -C "${pages_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${pages_dir}" add -A
          if ! git -C "${pages_dir}" diff --cached --quiet; then
            git -C "${pages_dir}" commit -m "Deploy production ${GITHUB_SHA}"
            git -C "${pages_dir}" push origin HEAD:gh-pages
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages
          include-hidden-files: true

  deploy:
    name: Publish GitHub Pages
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    # Pages deployments can wait in GitHub's queue for a few minutes.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
