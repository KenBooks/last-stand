  <div id="perf-ask" class="hidden" role="dialog" aria-live="polite" aria-label="Performance report">
    <div class="pa-ask">
      <div class="pa-title">The game ran slowly</div>
      <div class="pa-text">Send a performance report so it can be made to run better? It holds the last minute's frame timings, what was on screen, your device and graphics settings, nothing about you (<span class="pa-size"></span>).</div>
      <div class="pa-buttons"><button class="btn primary pa-send">Send</button><button class="btn pa-later">Not now</button><button class="btn pa-always">Always send</button></div>

    <div class="pa-done"><span class="pa-note"></span><button class="btn pa-close" aria-label="Close">&times;</button></div>
  </div>
