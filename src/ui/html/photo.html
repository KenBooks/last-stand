  <div id="photo" class="hidden">
    <div class="ph-pad" aria-hidden="true"></div>
    <div class="ph-bar ph-top hidden"></div><div class="ph-bar ph-foot-bar hidden"></div>
    <div class="ph-panel" role="dialog" aria-label="Photo mode">
      <div class="ph-head"><span class="ph-title">Photo mode</span>
        <button class="btn" id="ph-hide" title="Hide this panel for the shot (H)">Hide</button>
        <button class="btn" id="ph-leave" title="Back to the game (Esc)">Leave</button></div>
      <div class="ph-coop hidden">Playing together, the world keeps moving.</div>
      <div class="ph-body"></div>
      <div class="ph-foot"><button class="btn" id="ph-reset">Reset</button>
        <button class="btn primary" id="ph-take" title="Saves a PNG (Space)">Take photo</button></div>
      <div class="ph-keys">Drag to turn, right drag to move, wheel to zoom (Shift: lens). WASD, Q/E fly, Z/C tilt,
        R recentre, Space takes the photo, H hides this, Esc leaves.</div>
      <div class="ph-keys-touch">Drag to turn, two fingers to move and zoom.</div>
    </div>
    <button class="btn ph-show hidden" id="ph-show" title="Show the panel (H)">Show panel</button>
    <div class="ph-saved hidden" role="status" aria-live="polite"></div>
  </div>
